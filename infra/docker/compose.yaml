services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: goal-n-habit-tracker-web
    container_name: goal-n-habit-tracker-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
